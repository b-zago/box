# maybe later think on setting this up with support for multiple server nodes
- name: Install k3s server
  hosts: server
  become: true
  tasks:
    - name: Ensure k3s config directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write k3s config file
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          write-kubeconfig-mode: "0600"
          disable:
            - "traefik"
            - "servicelb"
          tls-san:
            - "{{ ansible_host }}"
          kube-apiserver-arg:
            - "service-account-issuer=https://{{ s3_bucket }}.s3.{{ s3_region }}.amazonaws.com/{{ s3_key }}"
            - "service-account-jwks-uri=https://{{ s3_bucket }}.s3.{{ s3_region }}.amazonaws.com/{{ s3_key }}/openid/v1/jwks"

    - name: Install k3s
      ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure .kube directory exists
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy kubeconfig for {{ ansible_user }}
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/{{ ansible_user }}/.kube/config
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Set KUBECONFIG in .bashrc for {{ ansible_user }}
      ansible.builtin.lineinfile:
        path: /home/{{ ansible_user }}/.bashrc
        line: "export KUBECONFIG=$HOME/.kube/config"
        create: true

    - name: Fetch kubeconfig to localhost
      ansible.builtin.fetch:
        src: /home/{{ ansible_user }}/.kube/config
        dest: ~/.kube/{{ ansible_hostname }}.yaml
        flat: yes

    - name: Set permissions on fetched kubeconfig
      ansible.builtin.file:
        path: ~/.kube/{{ ansible_hostname }}.yaml
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Edit with correct IP
      ansible.builtin.replace:
        path: ~/.kube/{{ ansible_hostname }}.yaml
        regexp: '127\.0\.0\.1'
        replace: "{{ ansible_host }}"
      delegate_to: localhost
      become: false

    - name: Ensure k3s service is active
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait for this node to be Ready
      ansible.builtin.shell: kubectl get node {{ ansible_hostname }} --no-headers | awk '{print $2}'
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: node_status
      until: node_status.stdout == "Ready"
      retries: 30
      delay: 5
      changed_when: false

- name: Configure OIDC
  hosts: server
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Read OIDC discovery doc
      ansible.builtin.command: kubectl get --raw /.well-known/openid-configuration
      register: oidc_discovery
      changed_when: false

    - name: Read JWKS
      ansible.builtin.command: kubectl get --raw /openid/v1/jwks
      register: oidc_jwks
      changed_when: false

    - name: Publish discovery doc
      amazon.aws.s3_object:
        bucket: "{{ s3_bucket }}"
        region: "{{ s3_region }}"
        object: "{{ s3_key }}/.well-known/openid-configuration"
        content: "{{ oidc_discovery.stdout }}"
        mode: put
        headers:
          ContentType: "application/json"
      delegate_to: localhost
      become: false

    - name: Publish JWKS
      amazon.aws.s3_object:
        bucket: "{{ s3_bucket }}"
        region: "{{ s3_region }}"
        object: "{{ s3_key }}/openid/v1/jwks"
        content: "{{ oidc_jwks.stdout }}"
        mode: put
        headers:
          ContentType: "application/json"
      delegate_to: localhost
      become: false

- name: Setup OIDC on AWS side via terraform
  hosts: localhost
  tasks:
    - name: Get env from server host
      ansible.builtin.set_fact:
        env: "{{ hostvars['k3s-server']['env'] }}"

    - name: Get iam roles from server host
      ansible.builtin.set_fact:
        iam_roles: "{{ hostvars['k3s-server']['iam_roles'] }}"

    - name: Set tfvars path
      ansible.builtin.set_fact:
        tfvars_path: "{{ playbook_dir }}/../terraform/aws/oidc/terraform.tfvars.json"

    - name: Read existing tfvars
      ansible.builtin.set_fact:
        tfvars: "{{ lookup('file', tfvars_path) | from_json }}"

    - name: Parse JSON and append if missing
      ansible.builtin.set_fact:
        tfvars: "{{ tfvars | combine({'clusters': {env: iam_roles}}, recursive=True) }}"

    - name: Write tfvars back
      ansible.builtin.copy:
        content: "{{ tfvars | to_nice_json(sort_keys=false) }}"
        dest: "{{ tfvars_path }}"

    - name: Run terraform
      community.general.terraform:
        project_path: ../terraform/aws/oidc/
        state: present
        force_init: true
      register: tf_output

    - name: Show tf_output
      ansible.builtin.debug:
        var: tf_output.outputs

    - name: Git pull
      ansible.builtin.command:
        cmd: git pull origin main
        chdir: ../terraform/aws/oidc/
      changed_when: false

    - name: Check for new/untracked files
      ansible.builtin.command:
        cmd: git status --porcelain .
        chdir: ../terraform/aws/oidc/
      register: git_status
      changed_when: false

    - name: Commit and push changes to aws oidc
      ansible.builtin.shell: git add "../terraform/aws/oidc/" && git commit -m "AWS OIDC changes" && git push origin main
      when: git_status.stdout | length > 0
      changed_when: false

- name: Setup own trusted CA
  hosts: server
  become: true
  tasks:
    - name: Sign and upload to SSM tls for argocd
      ansible.builtin.command: ./ca/sign-cert.sh "{{ argocd_ip }}" "{{ ca_bucket }}/{{ ca_cert_path }}" argocd "{{ env }}"
      become: false
      delegate_to: localhost

    - name: Check if CA present
      ansible.builtin.shell: test -f /usr/local/share/ca-certificates/ca.crt && echo "exists" || echo "not found"
      register: cert_exists
      changed_when: false

    - name: Get object from S3 bucket
      amazon.aws.s3_object:
        bucket: "{{ ca_bucket }}"
        object: "{{ ca_cert_path }}/ca.crt"
        dest: /tmp/k3s-ca.crt
        mode: get
        overwrite: different
      delegate_to: localhost
      become: false
      when: cert_exists.stdout == "not found" or force_ca_config

    - name: Copy local file to remote
      ansible.builtin.copy:
        src: /tmp/k3s-ca.crt
        dest: /usr/local/share/ca-certificates/ca.crt
        owner: root
        group: root
        mode: "0644"
      when: cert_exists.stdout == "not found" or force_ca_config

    - name: Update CA certificates
      ansible.builtin.command: update-ca-certificates
      when: cert_exists.stdout == "not found" or force_ca_config

- name: Bootstrap argocd
  hosts: server
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Get tf_output from localhost
      ansible.builtin.set_fact:
        tf_output: "{{ hostvars['localhost']['tf_output'] }}"

    - name: Ensure git is installed
      ansible.builtin.package:
        name: git
        state: present

    - name: Ensure jq is installed
      ansible.builtin.package:
        name: jq
        state: present

    - name: Generate cluster manifests
      ansible.builtin.command: ./files/cluster-overlay.sh
      args:
        creates: ../k3s/overlays/{{ env }}
      environment:
        ENV: "{{ env }}"
        ARGOCD_IP: "{{ argocd_ip }}"
        DOMAIN: "{{ domain }}"
        TRAEFIK_IP: "{{ traefik_ip }}"
        ESO_ROLE_ARN: "{{ tf_output.outputs.providers.value[env][eso_role] }}"
        METALLB_POOL: "{{ metallb_pool }}"
      become: false
      delegate_to: localhost

    - name: Git pull
      ansible.builtin.command:
        cmd: git pull origin main
        chdir: ../k3s/overlays/
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Check for new/untracked files
      ansible.builtin.command:
        cmd: git status --porcelain .
        chdir: "../k3s/overlays/"
      register: git_status
      changed_when: false
      become: false
      delegate_to: localhost

    - name: Commit and push new cluster manifests
      ansible.builtin.shell: git add "../k3s/overlays/{{ env }}" && git commit -m "Generated cluster {{ env }}" && git push origin main
      when: git_status.stdout | length > 0
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Install argocd CLI
      shell: |
        VERSION=v3.3.7
        curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/download/$VERSION/argocd-linux-amd64
        install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
        rm argocd-linux-amd64
      args:
        creates: /usr/local/bin/argocd

    - name: Install argocd
      #just apply from my kustomize config to be honest since apply is safe to do over and over either way
      ansible.builtin.command: kubectl apply -k github.com/b-zago/box/k3s/base/config/argocd?ref=main --server-side --force-conflicts
      register: argocd_apply
      changed_when: false

    - name: Wait for argocd to be Ready
      ansible.builtin.shell: echo "$(kubectl get deployment/argocd-server -n argocd -o json | jq .status.readyReplicas):$(kubectl get deployment/argocd-repo-server -n argocd -o json | jq .status.readyReplicas)"
      register: argocd_status
      vars:
        argocd_status_parts: "{{ argocd_status.stdout.split(':') }}"
      until: argocd_status_parts[0] | int >= 1 and argocd_status_parts[1] | int >= 1
      retries: 30
      delay: 5
      changed_when: false

    - name: Wait for argocd-application-controller
      ansible.builtin.command: kubectl wait statefulset/argocd-application-controller -n argocd --for=jsonpath='{.status.readyReplicas}'=1 --timeout=150s
      changed_when: false

    - name: Apply argocd server patch
      ansible.builtin.command:
        argv:
          - kubectl
          - patch
          - svc
          - argocd-server
          - -n
          - argocd
          - -p
          - '{"spec": {"type": "LoadBalancer", "loadBalancerIP": "{{ argocd_ip }}"}}'
      changed_when: false

    - name: Apply infra-app
      ansible.builtin.command: kubectl apply -k github.com/b-zago/box/k3s/overlays/{{ env }}/infra?ref=main --server-side
      changed_when: false

    - name: Wait for MetalLB
      ansible.builtin.command: kubectl wait deployment/metallb-controller -n metallb-system --for=jsonpath='{.status.readyReplicas}'=1 --timeout=150s
      register: metallb_wait
      until: metallb_wait.rc == 0
      retries: 10
      delay: 5
      changed_when: false

    - name: Apply MetalLB config
      ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/b-zago/box/main/k3s/overlays/{{ env }}/config/metallb.yaml
      changed_when: false

    - name: Wait for argocd-server to pick up IP from MetalLB - testing connection
      ansible.builtin.wait_for:
        host: "{{ argocd_ip }}"
        port: 443
        state: started
        delay: 5
        timeout: 300

    - name: Get initial password
      ansible.builtin.shell: kubectl get secret/argocd-initial-admin-secret -n argocd -o json | jq -r .data.password | base64 -d
      register: argocd_initial_password
      changed_when: false

    - name: Login to argocd as default admin
      ansible.builtin.command:
        argv:
          - argocd
          - login
          - "{{ argocd_ip }}"
          - --insecure #insecure is fine since argo wont have external access either way
          - --username
          - admin
          - --password
          - "{{ argocd_initial_password.stdout }}"
      when: argocd_initial_password.stdout != ""
      changed_when: false
      no_log: true

    - name: Change argocd user password
      ansible.builtin.command:
        argv:
          - argocd
          - account
          - update-password
          - --account
          - "{{ argocd_username }}"
          - --current-password
          - "{{ argocd_initial_password.stdout }}"
          - --new-password
          - "{{ argocd_password }}"
      when: argocd_initial_password.stdout != ""
      changed_when: false

    - name: Delete argocd-initial-admin-secret
      ansible.builtin.command: kubectl delete secret/argocd-initial-admin-secret -n argocd
      when: argocd_initial_password.stdout != ""
      changed_when: false

    - name: Apply root-app
      ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/b-zago/box/main/k3s/overlays/{{ env }}/root-app.yaml
      changed_when: false
