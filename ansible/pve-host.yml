- name: Install proxmox
  become: true
  hosts: pve
  pre-tasks:
    - name: Check whether Proxmox VE is already running
      ansible.builtin.command: systemctl is-active pve-cluster pvedaemon pveproxy
      register: pve_active
      changed_when: false
      failed_when: false

    - name: End the play for this host
      ansible.builtin.meta: end_host
      when: pve_active.rc == 0 and not pve_force

  tasks:
    - name: Ensure Hostname Resolves to Hosts IP Address
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '.*\s{{ ansible_hostname }}\s*$'
        line: "{{ ansible_default_ipv4.address }} {{ ansible_hostname }}"

    - name: Check that the hostname resolves to a routable address
      ansible.builtin.command: hostname --ip-address
      register: pve_hostname_ip
      changed_when: false

    - name: Fail if the hostname only resolves to a loopback address
      ansible.builtin.assert:
        that:
          - pve_hostname_ip.stdout.find('"{{ ansible_host }}"') != -1
        fail_msg: "hostname --ip-address returned only loopback addresses: {{ pve_hostname_ip.stdout }}"

    - name: Install the Proxmox VE archive keyring
      ansible.builtin.get_url:
        url: "{{ pve_keyring_url }}"
        dest: "{{ pve_keyring }}"
        checksum: "sha256:{{ pve_keyring_sha256 }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add the Proxmox VE no-subscription repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-install-repo.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: {{ pve_suite }}
          Components: {{ pve_component }}
          Signed-By: {{ pve_keyring }}

    - name: Update apt cache and upgrade the base system
      ansible.builtin.apt:
        update_cache: true
        upgrade: full

    - name: Install the Proxmox VE kernel
      ansible.builtin.apt:
        name: proxmox-default-kernel
        state: present
      register: pve_kernel

    - name: Reboot into the Proxmox VE kernel
      ansible.builtin.reboot:
        reboot_timeout: 900
      when: pve_kernel.changed

    - name: Install the Proxmox VE packages
      ansible.builtin.apt:
        name: "{{ pve_packages }}"
        state: present
        update_cache: true

    - name: Remove linux-image packages
      ansible.builtin.apt:
        name:
          - linux-image-amd64
          - "linux-image-6.12*"
        state: absent
      notify: update grub

    - name: Remove os-prober
      ansible.builtin.apt:
        name: os-prober
        state: absent

  handlers:
    - name: update grub
      ansible.builtin.command: update-grub
