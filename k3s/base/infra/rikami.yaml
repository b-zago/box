apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rikami-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/b-zago/rikami-operator
    targetRevision: HEAD
    path: dist/
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
