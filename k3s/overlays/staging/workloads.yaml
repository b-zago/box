apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/b-zago/box
        revision: HEAD
        directories:
          - path: k3s/overlays/staging/workloads/*
  template:
    metadata:
      name: "{{.path.basename}}"
    spec:
      destination:
        namespace: staging
