apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/b-zago/box
        revision: HEAD
        directories:
          - path: k3s/overlays/staging/workloads/*
  template:
    spec:
      # Every staging workload is the generic helm-framework chart, configured
      # by layered values files (see k3s/charts/app/values.yaml).
      source:
        path: k3s/charts/app
        helm:
          releaseName: "{{.path.basename}}"
          # Name resources after the app (nyanify) rather than <release>-<chart>.
          parameters:
            - name: nameOverride
              value: "{{.path.basename}}"
          valueFiles:
            - ../../overlays/staging/workloads/values.yaml
            - ../../base/workloads/{{.path.basename}}/values.yaml
            - ../../overlays/staging/workloads/{{.path.basename}}/values.yaml
      destination:
        namespace: staging
