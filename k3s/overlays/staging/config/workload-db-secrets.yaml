# Database credentials for workloads. They live here, outside the app charts,
# because each app's schema Job runs as a PreSync hook, before the app's own
# resources exist. Names are env-independent so k3s/base/workloads values can
# reference them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scorevault-db-app
  namespace: staging
spec:
  refreshInterval: 0s
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    template:
      mergePolicy: Merge
      data:
        POSTGRES_DB: scorevault-staging
  data:
    - secretKey: db_host
      remoteRef: {key: /clusters/pgsql/staging/scorevault-staging/app, property: host}
    - secretKey: db_username
      remoteRef: {key: /clusters/pgsql/staging/scorevault-staging/app, property: username}
    - secretKey: db_password
      remoteRef: {key: /clusters/pgsql/staging/scorevault-staging/app, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scorevault-db-migrator
  namespace: staging
spec:
  refreshInterval: 0s
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  data:
    - secretKey: url
      remoteRef: {key: /clusters/pgsql/staging/scorevault-staging/migrator, property: url}
