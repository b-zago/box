apiVersion: rikami.zagoapps.com/v1alpha1
kind: Profile
metadata:
  name: default
  namespace: staging
spec:
  gateway: staging-gateway
  pullPolicy: Always
  pullSecret: ghcr-creds
  domain: staging.zagoapps.com
  externalSecretsConfig:
    refreshPolicy: CreatedOnce
    refreshInterval: 0s
    secretStoreRef:
      name: aws-ssm
      kind: ClusterSecretStore
  databaseConfig:
    appConfig:
      hostKey: host
      passwordKey: password
      usernameKey: username
      secretAppPath: /clusters/pgsql/staging/*/app
    migratorConfig:
      secretMigratorPath: /clusters/pgsql/staging/*/migrator
      secretKey: url
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
