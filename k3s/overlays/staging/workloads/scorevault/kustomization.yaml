apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging

resources:
  - ../../../../base/workloads/scorevault/

patches:
  - target:
      kind: Vessel
      name: scorevault
    patch: |-
      - op: test
        path: /spec/servers/0/name
        value: scorevault
      - op: replace
        path: /spec/servers/0/image
        value: ghcr.io/b-zago/scorevault/webserver:1.0.1-staging.7
      - op: add
        path: /spec/servers/0/envs/POSTGRES_DB
        value: scorevault-staging
      - op: test
        path: /spec/servers/0/databases/0/name
        value: scorevault
      - op: replace
        path: /spec/servers/0/databases/0/name
        value: scorevault-staging
