apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod

resources:
  - ../../../../base/workloads/nyanify/

patches:
  - target:
      kind: Vessel
      name: nyanify
    patch: |-
      - op: test
        path: /spec/servers/0/name
        value: nyanify
      - op: replace
        path: /spec/servers/0/image
        value: ghcr.io/b-zago/nyanify/webserver:1.0.0
      - op: add
        path: /spec/servers/0/externalSecrets
        value:
          - extract: /clusters/prod/nyanify/app
            name: nyanify
