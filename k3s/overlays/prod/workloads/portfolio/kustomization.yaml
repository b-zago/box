apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod

resources:
  - ../../../../base/workloads/portfolio/

patches:
  - target:
      kind: Vessel
      name: portfolio
    patch: |-
      - op: test
        path: /spec/servers/0/name
        value: portfolio
      - op: replace
        path: /spec/servers/0/image
        value: ghcr.io/b-zago/portfolio/webserver:1.0.0
