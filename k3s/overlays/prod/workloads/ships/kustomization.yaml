apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod

resources:
  - ../../../../base/workloads/ships/

patches:
  - target:
      kind: Vessel
      name: ships
    patch: |-
      - op: test
        path: /spec/servers/0/name
        value: ships
      - op: replace
        path: /spec/servers/0/image
        value: ghcr.io/b-zago/ships/server:1.0.3
