# Prod-wide helm-framework defaults for every workload. Apps override any of
# these in their own values files (see k3s/charts/app/values.yaml).

image:
  pullPolicy: Always
imagePullSecrets:
  - name: ghcr-creds

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Argo applies each Service only after its Deployment is healthy, so a
# Service never points at pods that are not Ready yet.
service:
  annotations:
    argocd.argoproj.io/sync-wave: "1"

httpRoute:
  parentRefs:
    - prod-gateway

# Probes for every app; opt out with `healthChecks.enabled: false`.
healthChecks:
  enabled: true
  startupProbe:
    path: /ready
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 30
  livenessProbe:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Autoscaling policy; opt in with `horizontalPodAutoscaler.enabled: true`.
horizontalPodAutoscaler:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
