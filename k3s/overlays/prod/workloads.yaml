apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/b-zago/box
        revision: HEAD
        directories:
          - path: k3s/overlays/prod/workloads/*
  template:
    spec:
      # Every prod workload is the generic helm-framework chart, configured
      # by layered values files (see k3s/charts/app/values.yaml).
      source:
        path: k3s/charts/app
        helm:
          releaseName: "{{.path.basename}}"
          # Name resources after the app (nyanify) rather than <release>-<chart>.
          parameters:
            - name: nameOverride
              value: "{{.path.basename}}"
          valueFiles:
            - ../../overlays/prod/workloads/values.yaml
            - ../../base/workloads/{{.path.basename}}/values.yaml
            - ../../overlays/prod/workloads/{{.path.basename}}/values.yaml
      destination:
        namespace: prod
      # TEMPORARY, for the rikami -> helm-framework cutover: no auto-sync, so
      # nothing reaches the cluster until each app is synced by hand. Remove
      # once the cutover is done.
      syncPolicy:
        automated: null
