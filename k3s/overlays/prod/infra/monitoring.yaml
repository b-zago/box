apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 84.5.0
    chart: kube-prometheus-stack
    helm:
      values: |
        namespaceOverride: monitoring

        # k3s runs these inside the single k3s process (and uses SQLite, not etcd,
        # on a single server), so there are no separate targets to scrape and their
        # "Down" alerts would fire permanently.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        prometheus:
          prometheusSpec:
            persistentVolumeClaimRetentionPolicy:
              whenDeleted: Retain
              whenScaled: Retain
            retention: 14d
            retentionSize: 18GiB
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi

        alertmanager:
          config:
            route:
              receiver: nyanify
              group_by: ["alertname", "namespace"]
              repeat_interval: 12h
              routes:
                # Always-firing heartbeat and inhibition helper: no DMs.
                - receiver: "null"
                  matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
            receivers:
              - name: "null"
              - name: nyanify
                webhook_configs:
                  - url: http://nyanify.prod.svc.cluster.local/alertmanager
                    send_resolved: true
                    http_config:
                      authorization:
                        credentials_file: /etc/alertmanager/secrets/alertmanager-nyanify/token
          alertmanagerSpec:
            secrets:
              - alertmanager-nyanify
            persistentVolumeClaimRetentionPolicy:
              whenDeleted: Retain
              whenScaled: Retain
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi

        grafana:
          admin:
            existingSecret: grafana-secrets
            userKey: admin-user
            passwordKey: admin-password
          grafana.ini:
            server:
              root_url: https://grafana.int.zagoapps.com
          route:
            main:
              enabled: true
              hostnames:
                - grafana.int.zagoapps.com
              parentRefs:
                - name: internal-gateway
                  namespace: internal-gateway
