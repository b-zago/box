apiVersion: rikami.zagoapps.com/v1alpha1
kind: Profile
metadata:
  name: default
  namespace: prod
spec:
  gateway: prod-gateway
  pullPolicy: Always
  pullSecret: ghcr-creds
  domain: pve.zagoapps.com
  externalSecretsConfig:
    refreshPolicy: CreatedOnce
    refreshInterval: 0s
    secretStoreRef:
      name: aws-ssm
      kind: ClusterSecretStore
  databaseConfig:
    appConfig:
      hostKey: host
      passwordKey: password
      usernameKey: username
      secretAppPath: /clusters/pgsql/prod/*/app
    migratorConfig:
      secretMigratorPath: /clusters/pgsql/prod/*/migrator
      secretKey: url
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: entry
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: entry
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /ready
      port: entry
    periodSeconds: 5
    failureThreshold: 30
  metrics:
    endpoint: /metrics
    port: 9000
    interval: 30s
