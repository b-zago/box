apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  namespace: cert-manager
spec:
  acme:
    solvers:
      - selector:
          dnsZones:
            - ${DOMAIN}
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cf-token
              key: cf-token
