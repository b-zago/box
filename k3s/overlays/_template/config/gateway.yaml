apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${ENV}-gateway
  namespace: ${ENV}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      hostname: "*.${DOMAIN}"
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: zagoapps-com-tls
    - name: websecure-apex
      hostname: "${DOMAIN}"
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: zagoapps-com-apex-tls
