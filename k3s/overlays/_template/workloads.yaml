apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/b-zago/box
        revision: HEAD
        directories:
          - path: k3s/overlays/${ENV}/workloads/*
  template:
    metadata:
      name: "{{.path.basename}}"
    spec:
      source:
        kustomize:
          patches:
            - target:
                kind: HTTPRoute
                name: "{{.path.basename}}"
              patch: |-
                - op: replace
                  path: /spec/hostnames/0
                  value: {{.path.basename}}.${DOMAIN}
                - op: replace
                  path: /spec/parentRefs/0/name
                  value: ${ENV}-gateway
      destination:
        namespace: ${ENV}
