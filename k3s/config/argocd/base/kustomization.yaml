apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd
# additional resources like ingress rules, cluster and repository secrets.
resources:
  - ns.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/refs/tags/v3.3.7/manifests/ha/install.yaml
# changes to config maps
patches:
  - path: argocd-server.yaml
  - path: argocd-cm.yaml
